<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d0d; color: #aaa; font: 13px Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { height: 86vh; aspect-ratio: 9 / 16; background: #000; }
  .ui { display: flex; gap: 10px; align-items: center; width: min(48vh, 92vw); }
  .ui input { flex: 1; }
  body.render { display: block; background: #000; }
  body.render canvas { height: auto; width: 1080px; }
  body.render .ui { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ui"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">0.00</span></div>
<script src="engine/core.js"></script>
<script src="engine/figure.js"></script>
<script src="engine/geometry.js"></script>
<script src="engine/type.js"></script>
<script src="engine/info.js"></script>
<script src="comps/preview.js"></script>
<script src="comps/main.js" onerror="void 0"></script>
<script>
  const q = new URLSearchParams(location.search);
  const comp = M.comps[q.get('comp') || 'preview'];
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  window.canvas = canvas;
  window.COMP = comp;
  window.renderAt = (t) => comp.render(ctx, t);
  if (q.get('render')) document.body.classList.add('render');
  window.ready = Promise.all(['400', '500', '600'].map((w) => document.fonts.load(`${w} 40px Inter`))).then(() => { renderAt(0); return true; });

  if (!q.get('render')) {
    const play = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
    let t = 0, playing = false, last = 0;
    const audio = q.get('audio') ? new Audio(q.get('audio')) : null;
    const show = () => { renderAt(t); scrub.value = (t / comp.duration) * 1000; tc.textContent = t.toFixed(2); };
    const loop = (now) => {
      if (!playing) return;
      t += (now - last) / 1000; last = now;
      if (audio) t = audio.currentTime;
      if (t >= comp.duration) { t = 0; if (audio) audio.currentTime = 0; }
      show();
      requestAnimationFrame(loop);
    };
    play.onclick = () => {
      playing = !playing; play.textContent = playing ? 'Pause' : 'Play';
      if (audio) playing ? audio.play() : audio.pause();
      if (playing) { last = performance.now(); requestAnimationFrame(loop); }
    };
    scrub.oninput = () => { t = (scrub.value / 1000) * comp.duration; if (audio) audio.currentTime = t; show(); };
    window.ready.then(show);
  }
</script>
</body>
</html>
