# EdgeBot settings — the only file you ever need to edit.
# Every line has a safe default. Delete a line to go back to the default.

mode: paper              # paper = pretend money. Real-money mode stays OFF until every go-live gate passes.
bankroll_eur: 1000       # used to size stakes in euros

football:
  leagues: [E0, E1, D1]  # E0 Premier League, E1 Championship, D1 Bundesliga
  markets: ["1X2", "OU2.5"]

bookmakers:
  # NRA-licensed operators you have YOUR OWN account with. Only these are ever recommended.
  playable: [bet365, betano, efbet, winbet]
  # Price references only. Never recommended as places to bet.
  sharp: [pinnacle, betfair_exchange]
  sharp_weights: {pinnacle: 0.6, betfair_exchange: 0.4}
  commission: {betfair_exchange: 0.05}

pricing:
  devig_method: auto        # auto picks the most accurate of: multiplicative, power, shin, additive
  max_odds_age_seconds: 300 # prices older than this are ignored

strategy:
  name: market_value        # market_value (A: soft book vs sharp fair price) | model_blend (B: own model + market)
  edge_threshold: 0.03      # bet only when at least 3% better than the fair price, after the margin
  max_edge: 0.20            # bigger "edges" are almost always bad or stale data, so they are skipped
  min_odds: 1.25
  max_odds: 8.0
  min_minutes_before_kickoff: 15  # you need time to place the bet yourself
  model_weight: 0.25        # B only: how much our own model counts against the market
  stake_shrink: 0.5         # B only: stake as if the edge were half as big (protects against model errors)

risk:
  level: balanced           # safe | balanced | aggressive
  max_daily_exposure: 0.10  # at most 10% of bankroll staked per day
  one_bet_per_match: true   # never stack bets on the same match
  daily_loss_limit: 0.05
  weekly_loss_limit: 0.10
  monthly_loss_limit: 0.15
  drawdown_pause: 0.20      # auto-pause after a 20% fall from the peak
  min_stake_eur: 1
  stake_rounding_eur: 1

parlays:
  enabled: true             # only built from legs that each have an edge on their own
  min_legs: 2
  max_legs: 3
  max_stake: 0.005          # 0.5% of bankroll at most, counted in the daily limit
  max_per_day: 1

timing:
  bucket_edges_hours: [72, 24, 6, 1]   # "3+ days", "1–3 days", "6–24 h", "1–6 h", "last hour"

model:                      # Strategy B's Dixon–Coles goals model
  half_life_days: 365
  lookback_days: 730
  l2: 0.002
  min_train_matches: 150
  new_team_penalty: 0.15

backtest:
  source: sample            # sample (synthetic, offline) | football_data (real past odds, free)
  leagues: [E0, E1, D1]
  seasons: ["1920", "2021", "2122", "2223", "2324", "2425", "2526"]
  warmup_seasons: 1         # first season is only used to learn; no bets
  slippage: [0.01, 0.02]    # assume 1–2% worse odds than quoted
  rejection_rate: 0.10      # 10% of bets randomly refused
  decision_latency_seconds: 60
  result_delay_minutes: 135
  drawdown_pause_days: 14   # backtest stand-in for "you reviewed and resumed"
  account_limits:           # bookmakers limit winning customers; this is treated as a cost
    max_stake_eur: 500
    limit_after_bets: 200
    limited_max_stake_eur: 5
  seed: 42
  bootstrap_samples: 2000
  min_bets_for_verdict: 300

holdout:
  start: "2025-08-01"       # everything from here is sealed for ONE final test (python -m edgebot holdout --confirm)

go_live_gates:
  min_paper_bets: 1000
  min_avg_clv: 0.02
  require_clv_ci_above_zero: true
  require_positive_roi: true
  max_drawdown: 0.20
  manual_confirmation: true

execution:
  real_money_enabled: false # also hard-disabled in code
